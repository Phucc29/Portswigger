{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Recent Posts</h2>
<div class="row">
    {% for post in posts %}
    <div class="col-md-8">
        <div class="card mb-3 shadow-sm">
            <div class="card-body">
                <h4 class="card-title"><a href="/post/{{ post.id }}">{{ post.title }}</a></h4>
                <p class="card-text text-muted">{{ post.content[:100] }}...</p>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
