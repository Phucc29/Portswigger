<!DOCTYPE html>
<html>
<head>
    <title>Order Confirmation</title>
</head>
<body>

<h1>✅ Order Completed!</h1>

<p>Your purchase was successful.</p>

<table border="1">

<tr>
    <th>Product</th>
    <th>Qty</th>
    <th>Subtotal</th>
</tr>

{% for item, qty in items.items() %}

<tr>
    <td>{{ item }}</td>
    <td>{{ qty }}</td>
    <td>{{ products[item] * qty }} $</td>
</tr>

{% endfor %}

</table>

<h2>Total: {{ total }} $</h2>

<br>

<a href="/shop">Back to Shop</a>

|
<a href="/orders">View Orders</a>

</body>
</html>
