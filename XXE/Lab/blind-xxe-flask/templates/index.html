<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Blind XXE Lab - Product Stock Check</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f5f5f5;
        }

        h2 {
            margin-bottom: 20px;
        }

        .card {
            width: 320px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
        }

        button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }

        #result {
            margin-top: 25px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<h2>Products</h2>

{% for product in products %}

<div class="card">

    <h3>{{ product[1] }}</h3>

    <p>Product ID: {{ product[0] }}</p>

    <button onclick="checkStock({{ product[0] }})">
        Check stock
    </button>

</div>

{% endfor %}

<div id="result"></div>

<script>

function checkStock(productId){

    const xmlPayload =
`<?xml version="1.0" encoding="UTF-8"?>
<stockCheck>
    <productId>${productId}</productId>
    <storeId>1</storeId>
</stockCheck>`;

    fetch("/check-stock",{
        method:"POST",
        headers:{
            "Content-Type":"text/xml"
        },
        body:xmlPayload
    })
    .then(response => response.text())
    .then(data=>{
        document.getElementById("result").innerText = data;
    })
    .catch(err=>{
        console.log(err);
    });

}

</script>

</body>
</html>
